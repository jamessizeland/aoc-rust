[package]
name = "aoc"
version = "0.1.0"
edition = "2024"
resolver = "3"

default-run = "cli"

[dependencies]
# CLI
prettyplease = "0.3.0"
proc-macro2 = "1.0.103"
quote = "1.0.42"
syn = "3.0.10"
jiff = "1.0.2"
clap = { version = "4.6.9", features = ["derive"] }

# Useful crates
anyhow = "1.0.104"
itertools = "0.15.0"
pathfinding = "4.14.0"
regex = "1.12.2"
rayon = "1.11.0"
colored = "3.0.0"
